# Busca diaria dos clipes mais vistos da Twitch, edicao via Gemini (navegador) e envio.
twitch:
  jogo: ["Grand Theft Auto VI", "GTA VI", "Grand Theft Auto 6"]   # nomes da categoria, na ordem de tentativa
  idioma: pt               # idioma da live (campo language do clipe; aceita pt, pt-br...)
  quantidade: 5            # clipes novos por execucao
  janela_horas: 24         # "ultimo dia"
  duracao_min_seg: 8       # ignora clipes muito curtos

kick:
  ativo: true              # false = so Twitch
  jogo: ["grand-theft-auto-vi", "Grand Theft Auto VI"]   # slug ou nome da categoria, na ordem de tentativa
  idioma: pt               # idioma do canal (a Kick nao informa no clipe: usa o da live ou do ultimo VOD)
  quantidade: 5            # clipes novos por execucao
  janela_horas: 24         # <= 24 usa o "day" da Kick; maior usa a semana filtrada por horas
  duracao_min_seg: 8
  canais_ignorar: []       # slugs de canais a nunca usar

edicao:
  formato: vertical        # vertical = 1080x1920 com fundo desfocado (Shorts/TikTok); original = mantem 16:9
  previa_max_seg: 4        # trecho de previa (ponto de interesse) colocado no inicio
  usar_previa: true
  desfoque_tiktok: true    # o Gemini aponta trechos obscenos (nudez/sexo) e o TikTok recebe uma versao com eles desfocados; o YouTube nao
  desfoque_margem_seg: 0.3 # folga antes/depois de cada trecho desfocado
  usar_legendas: true      # Gemini decide se o clipe precisa; false = nunca legendar
  encoder: auto            # auto = tenta NVIDIA (nvenc), AMD (amf), Intel (qsv) e cai na CPU; ou fixe: nvenc | amf | qsv | cpu

gemini:
  url: "https://gemini.google.com/app?hl=en"
  perfil: .perfil_gemini   # perfil proprio do Chrome (login feito uma vez com: python gemini.py login)
  modelo: "Ajuda diaria"   # modo do Gemini escolhido a cada conversa (texto do seletor; ex.: Auto,
                           # Ajuda diaria = mais rapido, Analise mais aprofundada = mais lento). Vazio = nao mexe.
  chat_temporario: true    # abre cada conversa como "Chat temporario" (nao entra no historico da conta)
  porta_debug: 9333       # porta local usada para o Playwright controlar o Chrome
  timeout_resposta_seg: 240

publicacao:
  youtube: true
  tiktok: true
  tiktok_direto: false           # true: posta direto no perfil (privado sem auditoria; exige login --direto)
  privacidade_youtube: private   # private ate a auditoria da API; depois pode ser public
  hashtags: ["#GTA6", "#GTAVI", "#Shorts"]
  max_tiktok_por_dia: 5          # o TikTok recusa acima de ~5 rascunhos pendentes (publique/descarte no app)
  max_youtube_por_dia: 5         # cota gratuita da API: ~6 envios/dia
